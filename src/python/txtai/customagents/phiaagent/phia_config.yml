llm:
  method: litellm
  path: "openrouter/x-ai/grok-4.1-fast:free"
  api_key: ${OPENROUTER_API_KEY}
  api_base: https://openrouter.ai/api/v1
  temperature: 0.0
  messages_format: openai

tts:
  provider: groq
  model: playai-tts
  endpoint_url: https://api.groq.com/openai/v1
  api_key: ${GROQ_API_KEY}
  voice: Arista-PlayAI
  target_rate: 22050

stt:
  provider: huggingface
  model: openai/whisper-large-v3
  endpoint_url: https://router.huggingface.co/hf-inference/models/openai/whisper-large-v3
  api_key: ${HUG_API_KEY}
  chunk: 10
  target_rate: 16000

agent:
  name: phia_reasoning_agent
  description: >
    A PHIA health reasoning agent that uses DuckDB SQL,
    few-shot memory search, and tool-based LLM reasoning.

  max_iterations: 10
  method: tool

phia:
  activities_path : D:/backend/txtai/src/python/txtai/datas/activities.csv
  summary_path : D:/backend/txtai/src/python/txtai/datas/summary.csv
  
  memory:
    name: phia_memory
    description: "PHIA few-shot memory index"
    path: D:/backend/txtai/src/python/fewshots_index
    content: true

